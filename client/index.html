<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limiter Testing Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .request-history {
            max-height: 300px;
            overflow-y: auto;
        }
        .status-success {
            color: #198754;
        }
        .status-error {
            color: #dc3545;
        }
        .algorithm-description {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Rate Limiter Testing Interface</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Rate Limiter Configuration</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="algorithmSelect" class="form-label">Rate Limiting Algorithm</label>
                            <select class="form-select" id="algorithmSelect" onchange="updateAlgorithmDescription()">
                                <option value="fixed_window">Fixed Window</option>
                                <option value="token_bucket">Token Bucket</option>
                            </select>
                            <div id="algorithmDescription" class="algorithm-description">
                                Fixed Window: Allows a fixed number of requests within a time window.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="requestCount" class="form-label">Number of Requests</label>
                            <input type="number" class="form-control" id="requestCount" value="1" min="1" max="20">
                        </div>
                        <button class="btn btn-primary" onclick="sendRequests()">Send Requests</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Request History</h5>
                    </div>
                    <div class="card-body">
                        <div id="requestHistory" class="request-history">
                            <!-- Request history will be displayed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
